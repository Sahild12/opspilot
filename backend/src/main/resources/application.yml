spring:
  application:
    name: opspilot-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/opspilot
    username: opspilot
    password: opspilot
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080